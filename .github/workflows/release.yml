name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release-track:
        description: Release track.
        required: false
        default: stable
        type: choice
        options:
          - stable
          - prerelease

# One group per ref. Every run this workflow now takes is a real release, so
# none of them cancels an in-flight publish. The signed dry run moved into CI's
# Verify job and is no longer triggered here.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The caller must grant every permission the called workflow's jobs request.
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    uses: agoodkind/swift-makefile/.github/workflows/_release.yml@main
    with:
      release-track: ${{ github.event_name == 'workflow_dispatch' && inputs.release-track || '' }}
      release-on-merge: manual
      signing-identity-name: ${{ vars.APPLE_DEVELOPER_ID_IDENTITY }}
      apple-team-id: ${{ vars.APPLE_TEAM_ID }}
      notarize-pattern: "*.zip"
      sbom-subject-path: "Products/SMCFanHelper.app"
    secrets: inherit
